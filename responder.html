<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bauer Lemans — Responder reunión</title>
<link rel="icon" type="image/png" href="logo-bauer.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --paper:#F7F6F3; --ink:#14110F; --red:#D91E2B; --red-dim:#F4D9DB;
    --line:#E4E1DB; --gray:#8A8680; --violet:#6B4FA0; --violet-dim:#EAE3F5; --green:#3b7d3b; --green-dim:#DEF0DE;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding:48px 16px;
  }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:6px; width:100%; max-width:460px; padding:32px 28px; }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .brand img{ width:36px; height:auto; }
  .brand-sub{ font-family:'Oswald', sans-serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--violet); }
  h1{ font-family:'Oswald', sans-serif; font-size:21px; font-weight:600; margin-bottom:6px; }
  .hola{ font-size:14px; color:var(--gray); margin-bottom:18px; }
  .evt{ background:var(--paper); border-left:3px solid var(--violet); border-radius:4px; padding:14px 16px; font-size:14px; line-height:1.7; margin-bottom:22px; }
  .evt b{ font-size:15px; }
  .evt .desc{ color:var(--gray); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{
    flex:1; min-width:140px; font-family:'Oswald', sans-serif; font-size:13px; font-weight:500; letter-spacing:0.12em;
    text-transform:uppercase; padding:13px 18px; border-radius:4px; cursor:pointer; border:1px solid var(--line);
    background:var(--white); color:var(--ink); transition:all 0.15s ease;
  }
  .btn.ok{ background:var(--violet); border-color:var(--violet); color:var(--white); }
  .btn.ok:hover{ background:#5a4189; }
  .btn.no{ border-color:var(--red); color:var(--red); }
  .btn.no:hover{ background:var(--red-dim); }
  .btn.sugerido{ box-shadow:0 0 0 3px var(--violet-dim); }
  .btn.no.sugerido{ box-shadow:0 0 0 3px var(--red-dim); }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .estado{ display:inline-block; font-size:11px; padding:3px 10px; border-radius:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .estado.confirmado{ background:var(--green-dim); color:var(--green); }
  .estado.pendiente{ background:#FBEFD8; color:#96700f; }
  .estado.rechazado{ background:var(--red-dim); color:var(--red); }
  .msg{ font-size:14px; line-height:1.5; margin-top:16px; }
  .msg.err{ color:var(--red); }
  .msg.ok{ color:var(--green); }
  .loading{ color:var(--gray); font-size:14px; }
  .foot{ margin-top:22px; font-size:12.5px; color:var(--gray); }
  .foot a{ color:var(--violet); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="logo-bauer.png" alt="Bauer Lemans">
      <div class="brand-sub">Agenda · Bauer Lemans</div>
    </div>
    <div id="contenido"><p class="loading">Cargando reunión…</p></div>
    <div class="foot"><a href="./">Abrir la agenda</a></div>
  </div>

  <script>
    (function(){
      var SB_URL = 'https://lbbpnnvwtanurtjqgcqv.supabase.co';
      var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnBubnZ3dGFudXJ0anFnY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NjM2NDEsImV4cCI6MjA5MjMzOTY0MX0.a25lrgUlzDM4TSp4c6KOCQ3ERZnSk8-5r2y9DbhRPxg';
      var FN_URL = SB_URL + '/functions/v1/agenda-mail';

      var params = new URLSearchParams(location.search);
      var token = params.get('t') || '';
      var sugerido = params.get('r') || '';
      var cont = document.getElementById('contenido');

      function llamar(body){
        return fetch(FN_URL, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY },
          body: JSON.stringify(body)
        }).then(function(r){
          return r.json().catch(function(){ return {}; }).then(function(d){
            if (!r.ok) throw new Error(d.error || 'No se pudo conectar.');
            return d;
          });
        });
      }

      function esc(s){
        return String(s || '').replace(/[&<>"']/g, function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }

      function error(texto){
        cont.innerHTML = '<h1>No se pudo abrir</h1><p class="msg err">'+esc(texto)+'</p>';
      }

      if (!token) { error('El link está incompleto.'); return; }

      // Mostramos la reunión y la persona confirma con un clic.
      // (No se responde automáticamente al abrir el link, para evitar que
      //  los antivirus de correo que "previsualizan" enlaces respondan solos.)
      llamar({ accion:'ver_token', token:token }).then(function(d){
        var ubic = d.ubicacion
          ? (/^https?:\/\//i.test(d.ubicacion) ? '<a href="'+esc(d.ubicacion)+'" target="_blank" rel="noopener">'+esc(d.ubicacion)+'</a>' : esc(d.ubicacion))
          : '';
        var evtHtml =
          '<div class="evt">' +
            '<b>'+esc(d.titulo)+'</b><br>' +
            '📅 '+esc(d.fecha)+'<br>' +
            '🕘 '+esc(d.horario) +
            (ubic ? '<br>📍 '+ubic : '') +
            '<br>👤 Organiza: '+esc(d.organizador) +
            (d.descripcion ? '<br><span class="desc">'+esc(d.descripcion)+'</span>' : '') +
          '</div>';

        if (d.tipo !== 'asistente') {
          cont.innerHTML = '<h1>Reunión en seguimiento</h1><p class="hola">Hola '+esc(d.nombre)+', estás en seguimiento: no hace falta confirmar.</p>' + evtHtml;
          return;
        }
        if (d.pasada) {
          cont.innerHTML = '<h1>Esta reunión ya pasó</h1>' + evtHtml;
          return;
        }

        cont.innerHTML =
          '<h1>¿Vas a asistir?</h1>' +
          '<p class="hola">Hola '+esc(d.nombre)+' · Tu respuesta actual: <span class="estado '+esc(d.estado)+'" id="estadoActual">'+esc(d.estado)+'</span></p>' +
          evtHtml +
          '<div class="actions">' +
            '<button class="btn ok'+(sugerido==='confirmado'?' sugerido':'')+'" data-r="confirmado">Confirmar</button>' +
            '<button class="btn no'+(sugerido==='rechazado'?' sugerido':'')+'" data-r="rechazado">Rechazar</button>' +
          '</div>' +
          '<p class="msg" id="msg"></p>';

        var botones = cont.querySelectorAll('[data-r]');
        var msg = document.getElementById('msg');
        var estadoActual = document.getElementById('estadoActual');

        Array.prototype.forEach.call(botones, function(b){
          b.addEventListener('click', function(){
            var estado = b.getAttribute('data-r');
            Array.prototype.forEach.call(botones, function(x){ x.disabled = true; });
            msg.className = 'msg'; msg.textContent = 'Enviando…';
            llamar({ accion:'responder_token', token:token, estado:estado }).then(function(){
              estadoActual.className = 'estado '+estado;
              estadoActual.textContent = estado;
              msg.className = 'msg ok';
              msg.textContent = estado === 'confirmado'
                ? '¡Listo! Confirmaste tu asistencia. Ya le avisamos a quien organiza.'
                : 'Listo, rechazaste la reunión. Ya le avisamos a quien organiza.';
              Array.prototype.forEach.call(botones, function(x){ x.disabled = false; x.classList.remove('sugerido'); });
            }).catch(function(e){
              msg.className = 'msg err';
              msg.textContent = e.message;
              Array.prototype.forEach.call(botones, function(x){ x.disabled = false; });
            });
          });
        });
      }).catch(function(e){ error(e.message); });
    })();
  </script>
</body>
</html>
