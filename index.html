<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauer Lemans — Agenda</title>
<link rel="icon" type="image/png" href="logo-bauer.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --paper:#F7F6F3;
    --ink:#14110F;
    --red:#D91E2B;
    --red-dim:#F4D9DB;
    --line:#E4E1DB;
    --gray:#8A8680;
    --violet:#6B4FA0;
    --violet-dim:#EAE3F5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }

  /* ---------- HEADER ---------- */
  header{
    background:var(--white);
    border-bottom:1px solid var(--line);
    padding:20px 0;
  }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .head-left{ display:flex; align-items:center; gap:16px; }
  .head-left img{ width:42px; height:auto; }
  .head-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:20px; }
  .head-sub{ font-family:'Oswald', sans-serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--violet); }
  .back-link{
    font-family:'Oswald', sans-serif; font-size:12px; font-weight:500; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--gray); text-decoration:none; display:flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--ink); }
  .head-right{ display:flex; align-items:center; gap:10px; }
  .welcome-user{ font-family:'Oswald', sans-serif; font-size:12px; color:var(--gray); text-transform:uppercase; letter-spacing:0.06em; }

  .pill-btn{
    font-family:'Oswald', sans-serif; font-size:11px; font-weight:500; letter-spacing:0.14em;
    text-transform:uppercase; background:var(--white); border:1px solid var(--line); color:var(--ink);
    padding:9px 18px; border-radius:20px; cursor:pointer; transition:all 0.2s ease;
  }
  .pill-btn:hover{ border-color:var(--violet); color:var(--violet); }
  .pill-btn.primary{ background:var(--violet); border-color:var(--violet); color:var(--white); }
  .pill-btn.primary:hover{ background:#5a4189; color:var(--white); }

  /* ---------- CALENDAR TOOLBAR ---------- */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; padding:28px 0 16px; flex-wrap:wrap; gap:14px; }
  .month-nav{ display:flex; align-items:center; gap:14px; }
  .month-nav button{
    background:var(--white); border:1px solid var(--line); border-radius:50%; width:36px; height:36px;
    cursor:pointer; font-size:16px; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{ border-color:var(--violet); color:var(--violet); }
  .month-label{ font-family:'Oswald', sans-serif; font-size:22px; font-weight:600; text-transform:capitalize; min-width:200px; text-align:center; }

  /* ---------- CALENDAR GRID ---------- */
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px; }
  .cal-weekdays span{
    font-family:'Oswald', sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--gray); text-align:center; padding-bottom:4px;
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; padding-bottom:48px; }
  .cal-day{
    background:var(--white); border:1px solid var(--line); border-radius:6px; min-height:104px;
    padding:8px; cursor:pointer; transition:border-color 0.15s ease; display:flex; flex-direction:column; gap:4px;
  }
  .cal-day:hover{ border-color:var(--violet); }
  .cal-day.empty{ background:transparent; border:none; cursor:default; }
  .cal-day.today{ border-color:var(--violet); box-shadow:0 0 0 1px var(--violet); }
  .cal-day-num{ font-family:'Oswald', sans-serif; font-size:13px; font-weight:500; color:var(--ink); }
  .cal-day.today .cal-day-num{ color:var(--violet); font-weight:700; }
  .cal-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; padding-bottom:18px; }
  .cal-legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gray); }
  .cal-legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  .cal-evt{
    font-size:11px; padding:3px 6px 3px 8px; border-radius:3px; background:var(--violet-dim); color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;
    border-left:3px solid var(--violet);
  }
  .cal-evt.rechazado{ text-decoration:line-through; opacity:0.55; }
  .cal-evt.pendiente-marker{ outline:1.5px dashed #96700f; outline-offset:1px; }
  .cal-evt-more{ font-size:10.5px; color:var(--gray); padding-left:6px; }

  .badge.seguimiento{ background:var(--violet-dim); color:var(--violet); }

  @media (max-width:760px){
    .cal-grid{ gap:4px; }
    .cal-day{ min-height:64px; padding:5px; }
    .cal-weekdays span{ font-size:9.5px; }
    .cal-evt{ font-size:9.5px; padding:2px 4px; }
    .month-label{ font-size:18px; min-width:140px; }
    .head-title{ font-size:16px; }
  }

  /* ---------- MODALS ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,17,15,0.55); display:flex; align-items:flex-start;
    justify-content:center; z-index:999; padding:40px 20px; overflow-y:auto;
  }
  .overlay.hidden{ display:none; }
  .modal{ background:var(--white); width:100%; max-width:520px; border-radius:6px; padding:32px; }
  .modal h3{ font-family:'Oswald', sans-serif; font-size:19px; font-weight:600; margin-bottom:20px; }
  .modal label{
    display:block; font-family:'Oswald', sans-serif; font-size:11px; font-weight:500; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--gray); margin:14px 0 6px;
  }
  .modal input[type=text], .modal input[type=datetime-local], .modal textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-family:'Work Sans', sans-serif;
    font-size:14px; background:var(--paper); color:var(--ink);
  }
  .modal textarea{ resize:vertical; min-height:64px; }
  .modal input:focus, .modal textarea:focus{ outline:none; border-color:var(--violet); background:var(--white); }
  .row2{ display:flex; gap:12px; }
  .row2 > div{ flex:1; }
  .participantes-box{
    display:flex; flex-wrap:wrap; gap:8px 14px; max-height:150px; overflow-y:auto; padding:10px;
    border:1px solid var(--line); border-radius:4px; background:var(--paper); margin-top:2px;
  }
  .participantes-box label{ display:flex; align-items:center; gap:6px; font-size:13px; text-transform:none;
    letter-spacing:0; font-family:'Work Sans', sans-serif; color:var(--ink); margin:0; cursor:pointer; font-weight:400; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  .btn{
    font-family:'Oswald', sans-serif; font-size:12px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase;
    padding:10px 20px; border-radius:4px; cursor:pointer; border:1px solid var(--line); background:var(--white); color:var(--ink);
  }
  .btn:hover{ border-color:var(--violet); color:var(--violet); }
  .btn.primary{ background:var(--violet); border-color:var(--violet); color:var(--white); }
  .btn.primary:hover{ background:#5a4189; color:var(--white); }
  .btn.danger{ border-color:var(--red-dim); color:var(--red); }
  .btn.danger:hover{ background:var(--red-dim); border-color:var(--red); }
  .modal-msg{ font-size:12.5px; margin-top:12px; min-height:14px; }
  .modal-msg.err{ color:var(--red); }
  .modal-msg.ok{ color:#3b7d3b; }
  .close-x{ float:right; background:none; border:none; font-size:24px; cursor:pointer; color:var(--gray); line-height:1; }
  .close-x:hover{ color:var(--red); }

  /* ---------- DAY EVENTS LIST MODAL ---------- */
  .day-evt-item{ border:1px solid var(--line); border-radius:5px; padding:12px 14px; margin-bottom:10px; }
  .day-evt-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; margin-bottom:4px; }
  .day-evt-time{ font-size:12.5px; color:var(--gray); margin-bottom:6px; }
  .badge{ display:inline-block; font-size:10.5px; padding:2px 9px; border-radius:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .badge.confirmado{ background:#DEF0DE; color:#3b7d3b; }
  .badge.pendiente{ background:#FBEFD8; color:#96700f; }
  .badge.rechazado{ background:var(--red-dim); color:var(--red); }

  /* ---------- DETAIL MODAL ---------- */
  .detail-participantes{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .detail-participante{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; padding:4px 0; }

  /* ---------- LOADING / EMPTY ---------- */
  .loading-msg{ text-align:center; color:var(--gray); font-size:13px; padding:40px 0; }

  /* ---------- LOGIN GATE (reuso simplificado) ---------- */
  #loginGate{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center; z-index:9999; padding:24px;
  }
  #loginGate.hidden{ display:none; }
  .login-box{ background:var(--white); width:100%; max-width:340px; padding:36px 32px; border-radius:4px; text-align:center; }
  .login-box p{ font-size:13.5px; color:var(--gray); line-height:1.5; }
  .login-box a{ color:var(--violet); }
</style>
</head>
<body>

  <div id="loginGate">
    <div class="login-box">
      <div class="head-sub" style="margin-bottom:10px;">Sesión requerida</div>
      <p>Ingresá primero desde el portal principal de Bauer Lemans para acceder a la Agenda.</p>
      <br>
      <a class="pill-btn primary" style="text-decoration:none; display:inline-block;" href="https://crm-lasingluten.github.io/bauer-lemans/">Ir al portal</a>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="head-left">
        <img src="logo-bauer.png" alt="Bauer Lemans">
        <div>
          <div class="head-title">Agenda</div>
          <div class="head-sub">Módulo 10 · Calendario compartido</div>
        </div>
      </div>
      <div class="head-right">
        <span id="welcomeUser" class="welcome-user"></span>
        <a class="back-link" href="https://crm-lasingluten.github.io/bauer-lemans/">
          <svg width="14" height="10" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 6H1M1 6L6 1M1 6L6 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Volver al portal
        </a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="month-nav">
        <button id="prevMonth" aria-label="Mes anterior">‹</button>
        <div class="month-label" id="monthLabel">—</div>
        <button id="nextMonth" aria-label="Mes siguiente">›</button>
      </div>
      <button class="pill-btn primary" id="newEventBtn">+ Nueva reunión</button>
    </div>

    <div class="cal-legend" id="calLegend"></div>

    <div class="cal-weekdays">
      <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
    </div>
    <div class="cal-grid" id="calGrid">
      <div class="loading-msg">Cargando calendario…</div>
    </div>
  </div>

  <!-- Modal: día seleccionado (lista de eventos) -->
  <div class="overlay hidden" id="dayOverlay">
    <div class="modal">
      <button class="close-x" id="closeDayModal">&times;</button>
      <h3 id="dayModalTitle">Eventos</h3>
      <div id="dayEventsList"></div>
      <div class="modal-actions">
        <button class="btn primary" id="addFromDayBtn">+ Nueva reunión este día</button>
      </div>
    </div>
  </div>

  <!-- Modal: crear/editar evento -->
  <div class="overlay hidden" id="eventOverlay">
    <div class="modal">
      <button class="close-x" id="closeEventModal">&times;</button>
      <h3 id="eventModalTitle">Nueva reunión</h3>
      <input type="hidden" id="eventId">
      <label for="evTitulo">Título</label>
      <input type="text" id="evTitulo" placeholder="Reunión de equipo">
      <label for="evDescripcion">Descripción (opcional)</label>
      <textarea id="evDescripcion" placeholder="Temas a tratar…"></textarea>
      <div class="row2">
        <div>
          <label for="evInicio">Inicio</label>
          <input type="datetime-local" id="evInicio">
        </div>
        <div>
          <label for="evFin">Fin</label>
          <input type="datetime-local" id="evFin">
        </div>
      </div>
      <label for="evUbicacion">Ubicación / link de videollamada (opcional)</label>
      <input type="text" id="evUbicacion" placeholder="Oficina Bauer Lemans o link de Meet/Zoom">
      <label>Asistentes <span style="text-transform:none; font-weight:400; color:var(--gray);">— deben confirmar</span></label>
      <div class="participantes-box" id="evAsistentes"></div>
      <label>En seguimiento <span style="text-transform:none; font-weight:400; color:var(--gray);">— solo la ven en el calendario, no asisten</span></label>
      <div class="participantes-box" id="evVisualizadores"></div>
      <div class="modal-actions">
        <button class="btn danger hidden" id="deleteEventBtn">Eliminar</button>
        <button class="btn" id="cancelEventBtn">Cancelar</button>
        <button class="btn primary" id="saveEventBtn">Guardar</button>
      </div>
      <div class="modal-msg" id="eventModalMsg"></div>
    </div>
  </div>

  <!-- Modal: detalle de evento -->
  <div class="overlay hidden" id="detailOverlay">
    <div class="modal">
      <button class="close-x" id="closeDetailModal">&times;</button>
      <h3 id="detailTitle">—</h3>
      <div class="day-evt-time" id="detailTime"></div>
      <p id="detailDescripcion" style="font-size:13.5px; line-height:1.5; margin-bottom:10px;"></p>
      <p id="detailUbicacion" style="font-size:13.5px; color:var(--gray); margin-bottom:14px;"></p>
      <label style="margin-top:6px;">Organiza</label>
      <div id="detailCreador" style="font-size:13.5px;"></div>
      <label>Participantes</label>
      <div class="detail-participantes" id="detailParticipantes"></div>
      <div class="modal-actions" id="detailActions"></div>
      <div class="modal-msg" id="detailMsg"></div>
    </div>
  </div>

  <script>
    (function(){
      var SB_URL = 'https://lbbpnnvwtanurtjqgcqv.supabase.co';
      var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnBubnZ3dGFudXJ0anFnY3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NjM2NDEsImV4cCI6MjA5MjMzOTY0MX0.a25lrgUlzDM4TSp4c6KOCQ3ERZnSk8-5r2y9DbhRPxg';
      var HDR = { 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Prefer':'return=representation' };
      var SESSION_KEY = 'bauer_session';

      function sbRpc(fn, body){
        return fetch(SB_URL+'/rest/v1/rpc/'+fn, { method:'POST', headers: HDR, body: JSON.stringify(body||{}) })
          .then(function(r){
            return r.text().then(function(txt){
              var data = null;
              if (txt) { try { data = JSON.parse(txt); } catch(e){ data = null; } }
              if (!r.ok) { throw new Error((data && data.message) || 'Error de conexión'); }
              return data === null ? [] : data;
            });
          });
      }

      // ---------- sesión ----------
      var session = null;
      try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){}

      var gate = document.getElementById('loginGate');
      if (!session || !session.id) {
        gate.classList.remove('hidden');
        return; // no seguimos inicializando sin sesión
      }
      gate.classList.add('hidden');
      document.getElementById('welcomeUser').textContent = session.nombre;

      // ---------- estado ----------
      var currentMonth = new Date(); currentMonth.setDate(1);
      var usuarios = []; // {id, nombre}
      var eventosDelMes = [];
      var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      var DIAS_SEMANA = 7;

      // ---------- DOM ----------
      var calGrid = document.getElementById('calGrid');
      var monthLabel = document.getElementById('monthLabel');
      var prevBtn = document.getElementById('prevMonth');
      var nextBtn = document.getElementById('nextMonth');
      var newEventBtn = document.getElementById('newEventBtn');

      var dayOverlay = document.getElementById('dayOverlay');
      var dayModalTitle = document.getElementById('dayModalTitle');
      var dayEventsList = document.getElementById('dayEventsList');
      var closeDayModal = document.getElementById('closeDayModal');
      var addFromDayBtn = document.getElementById('addFromDayBtn');
      var selectedDayISO = null;

      var eventOverlay = document.getElementById('eventOverlay');
      var eventModalTitle = document.getElementById('eventModalTitle');
      var closeEventModal = document.getElementById('closeEventModal');
      var cancelEventBtn = document.getElementById('cancelEventBtn');
      var saveEventBtn = document.getElementById('saveEventBtn');
      var deleteEventBtn = document.getElementById('deleteEventBtn');
      var eventModalMsg = document.getElementById('eventModalMsg');
      var evId = document.getElementById('eventId');
      var evTitulo = document.getElementById('evTitulo');
      var evDescripcion = document.getElementById('evDescripcion');
      var evInicio = document.getElementById('evInicio');
      var evFin = document.getElementById('evFin');
      var evUbicacion = document.getElementById('evUbicacion');
      var evAsistentes = document.getElementById('evAsistentes');
      var evVisualizadores = document.getElementById('evVisualizadores');
      var calLegend = document.getElementById('calLegend');
      var coloresUsuarios = {}; // id -> color

      var detailOverlay = document.getElementById('detailOverlay');
      var closeDetailModal = document.getElementById('closeDetailModal');
      var detailTitle = document.getElementById('detailTitle');
      var detailTime = document.getElementById('detailTime');
      var detailDescripcion = document.getElementById('detailDescripcion');
      var detailUbicacion = document.getElementById('detailUbicacion');
      var detailCreador = document.getElementById('detailCreador');
      var detailParticipantes = document.getElementById('detailParticipantes');
      var detailActions = document.getElementById('detailActions');
      var detailMsg = document.getElementById('detailMsg');
      var currentDetailEventId = null;

      // ---------- helpers de fecha ----------
      function pad(n){ return n < 10 ? '0'+n : ''+n; }
      function toLocalInputValue(d){
        return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
      }
      function fmtHora(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
      function fmtFechaLarga(d){
        return d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      }
      function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
      function sameDay(a,b){ return dateKey(a) === dateKey(b); }

      // ---------- cargar usuarios (para selector de participantes + colores) ----------
      function cargarUsuarios(){
        return sbRpc('rpc_agenda_listar_usuarios', {}).then(function(rows){
          usuarios = rows || [];
          coloresUsuarios = {};
          usuarios.forEach(function(u){ coloresUsuarios[u.id] = u.color || '#6B4FA0'; });

          var otros = usuarios.filter(function(u){ return u.id !== session.id; });

          evAsistentes.innerHTML = otros.map(function(u){
            return '<label><input type="checkbox" class="ev-asis-chk" value="'+u.id+'"> '+u.nombre+'</label>';
          }).join('');
          evVisualizadores.innerHTML = otros.map(function(u){
            return '<label><input type="checkbox" class="ev-vis-chk" value="'+u.id+'"> '+u.nombre+'</label>';
          }).join('');

          // exclusión mutua: un usuario no puede ser asistente y visualizador a la vez
          evAsistentes.querySelectorAll('.ev-asis-chk').forEach(function(c){
            c.addEventListener('change', function(){
              if (c.checked) {
                var vis = evVisualizadores.querySelector('.ev-vis-chk[value="'+c.value+'"]');
                if (vis) vis.checked = false;
              }
            });
          });
          evVisualizadores.querySelectorAll('.ev-vis-chk').forEach(function(c){
            c.addEventListener('change', function(){
              if (c.checked) {
                var asis = evAsistentes.querySelector('.ev-asis-chk[value="'+c.value+'"]');
                if (asis) asis.checked = false;
              }
            });
          });

          calLegend.innerHTML = usuarios.map(function(u){
            return '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:'+(u.color || '#6B4FA0')+';"></span>'+u.nombre+'</span>';
          }).join('');
        }).catch(function(){
          evAsistentes.innerHTML = '<span style="color:var(--gray); font-size:12.5px;">No se pudieron cargar los usuarios.</span>';
          evVisualizadores.innerHTML = '';
        });
      }

      // ---------- calendario ----------
      function primerDiaSemanaISO(fecha){
        // Lunes = 0 ... Domingo = 6
        var d = fecha.getDay(); // 0=domingo
        return (d + 6) % 7;
      }

      function renderCalendario(){
        monthLabel.textContent = MESES[currentMonth.getMonth()] + ' ' + currentMonth.getFullYear();
        calGrid.innerHTML = '<div class="loading-msg" style="grid-column:1/-1;">Cargando eventos…</div>';

        var year = currentMonth.getFullYear();
        var month = currentMonth.getMonth();
        var primerDia = new Date(year, month, 1);
        var ultimoDia = new Date(year, month + 1, 0);
        var offset = primerDiaSemanaISO(primerDia);

        var desde = new Date(year, month, 1 - offset, 0, 0, 0);
        var hastaBase = new Date(year, month + 1, 0);
        var offsetFin = primerDiaSemanaISO(new Date(year, month + 1, 1));
        var diasExtra = offsetFin === 0 ? 0 : (7 - offsetFin);
        var hasta = new Date(year, month, ultimoDia.getDate() + diasExtra, 23, 59, 59);

        sbRpc('rpc_agenda_listar_eventos', {
          p_usuario_id: session.id,
          p_desde: desde.toISOString(),
          p_hasta: hasta.toISOString()
        }).then(function(rows){
          eventosDelMes = rows || [];
          pintarGrid(primerDia, ultimoDia, offset);
        }).catch(function(){
          calGrid.innerHTML = '<div class="loading-msg" style="grid-column:1/-1;">Error al cargar el calendario.</div>';
        });
      }

      function eventosDeDia(d){
        return eventosDelMes.filter(function(e){
          return sameDay(new Date(e.fecha_inicio), d);
        }).sort(function(a,b){ return new Date(a.fecha_inicio) - new Date(b.fecha_inicio); });
      }

      function pintarGrid(primerDia, ultimoDia, offset){
        var html = '';
        var hoy = new Date();

        for (var i = 0; i < offset; i++) { html += '<div class="cal-day empty"></div>'; }

        for (var day = 1; day <= ultimoDia.getDate(); day++) {
          var d = new Date(primerDia.getFullYear(), primerDia.getMonth(), day);
          var evts = eventosDeDia(d);
          var isToday = sameDay(d, hoy);
          var evHtml = evts.slice(0, 3).map(function(e){
            var color = e.creador_color || '#6B4FA0';
            var cls = 'cal-evt' + (e.mi_estado === 'rechazado' ? ' rechazado' : '') + (e.mi_estado === 'pendiente' ? ' pendiente-marker' : '');
            var style = 'border-left-color:'+color+'; background:'+tintColor(color, 0.14)+';';
            return '<div class="'+cls+'" style="'+style+'" data-evid="'+e.id+'">'+fmtHora(new Date(e.fecha_inicio))+' '+escHtml(e.titulo)+'</div>';
          }).join('');
          var masHtml = evts.length > 3 ? '<div class="cal-evt-more">+'+(evts.length - 3)+' más</div>' : '';

          html += '<div class="cal-day'+(isToday ? ' today' : '')+'" data-date="'+dateKey(d)+'">' +
                    '<div class="cal-day-num">'+day+'</div>' + evHtml + masHtml +
                  '</div>';
        }

        var totalCells = offset + ultimoDia.getDate();
        var remain = (7 - (totalCells % 7)) % 7;
        for (var j = 0; j < remain; j++) { html += '<div class="cal-day empty"></div>'; }

        calGrid.innerHTML = html;
      }

      function escHtml(s){
        return String(s || '').replace(/[&<>"']/g, function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }

      function tintColor(hex, alpha){
        var h = (hex || '#6B4FA0').replace('#','');
        if (h.length === 3) { h = h.split('').map(function(c){ return c+c; }).join(''); }
        var r = parseInt(h.substring(0,2),16) || 107;
        var g = parseInt(h.substring(2,4),16) || 79;
        var b = parseInt(h.substring(4,6),16) || 160;
        return 'rgba('+r+','+g+','+b+','+alpha+')';
      }

      prevBtn.addEventListener('click', function(){
        currentMonth.setMonth(currentMonth.getMonth() - 1);
        renderCalendario();
      });
      nextBtn.addEventListener('click', function(){
        currentMonth.setMonth(currentMonth.getMonth() + 1);
        renderCalendario();
      });

      // ---------- click en día / evento ----------
      calGrid.addEventListener('click', function(e){
        var evtEl = e.target.closest('[data-evid]');
        if (evtEl) {
          abrirDetalle(Number(evtEl.getAttribute('data-evid')));
          return;
        }
        var dayEl = e.target.closest('.cal-day[data-date]');
        if (dayEl) {
          abrirDiaModal(dayEl.getAttribute('data-date'));
        }
      });

      function abrirDiaModal(iso){
        selectedDayISO = iso;
        var parts = iso.split('-').map(Number);
        var d = new Date(parts[0], parts[1]-1, parts[2]);
        dayModalTitle.textContent = fmtFechaLarga(d);
        var evts = eventosDeDia(d);
        if (!evts.length) {
          dayEventsList.innerHTML = '<p style="color:var(--gray); font-size:13.5px;">No hay reuniones este día.</p>';
        } else {
          dayEventsList.innerHTML = evts.map(function(e){
            var badge = e.mi_tipo === 'visualizador'
              ? '<span class="badge seguimiento">seguimiento</span>'
              : '<span class="badge '+e.mi_estado+'">'+e.mi_estado+'</span>';
            var color = e.creador_color || '#6B4FA0';
            return '<div class="day-evt-item" data-evid="'+e.id+'" style="cursor:pointer; border-left:3px solid '+color+';">' +
                     '<div class="day-evt-title">'+escHtml(e.titulo)+'</div>' +
                     '<div class="day-evt-time">'+fmtHora(new Date(e.fecha_inicio))+' – '+fmtHora(new Date(e.fecha_fin))+' · '+escHtml(e.creador_nombre)+' · '+badge+'</div>' +
                   '</div>';
          }).join('');
        }
        dayOverlay.classList.remove('hidden');
      }
      dayEventsList.addEventListener('click', function(e){
        var item = e.target.closest('[data-evid]');
        if (item) { dayOverlay.classList.add('hidden'); abrirDetalle(Number(item.getAttribute('data-evid'))); }
      });
      closeDayModal.addEventListener('click', function(){ dayOverlay.classList.add('hidden'); });
      addFromDayBtn.addEventListener('click', function(){
        dayOverlay.classList.add('hidden');
        abrirFormularioNuevo(selectedDayISO);
      });

      // ---------- formulario crear/editar ----------
      function resetForm(){
        evId.value = '';
        evTitulo.value = '';
        evDescripcion.value = '';
        evInicio.value = '';
        evFin.value = '';
        evUbicacion.value = '';
        eventModalMsg.textContent = '';
        eventModalMsg.className = 'modal-msg';
        deleteEventBtn.classList.add('hidden');
        evAsistentes.querySelectorAll('.ev-asis-chk').forEach(function(c){ c.checked = false; });
        evVisualizadores.querySelectorAll('.ev-vis-chk').forEach(function(c){ c.checked = false; });
      }

      function abrirFormularioNuevo(iso){
        resetForm();
        eventModalTitle.textContent = 'Nueva reunión';
        if (iso) {
          var parts = iso.split('-').map(Number);
          var d = new Date(parts[0], parts[1]-1, parts[2], 9, 0);
          var f = new Date(parts[0], parts[1]-1, parts[2], 10, 0);
          evInicio.value = toLocalInputValue(d);
          evFin.value = toLocalInputValue(f);
        }
        eventOverlay.classList.remove('hidden');
      }
      newEventBtn.addEventListener('click', function(){ abrirFormularioNuevo(null); });

      function abrirFormularioEditar(ev, asistentesIds, visualizadoresIds){
        resetForm();
        eventModalTitle.textContent = 'Editar reunión';
        evId.value = ev.id;
        evTitulo.value = ev.titulo;
        evDescripcion.value = ev.descripcion || '';
        evInicio.value = toLocalInputValue(new Date(ev.fecha_inicio));
        evFin.value = toLocalInputValue(new Date(ev.fecha_fin));
        evUbicacion.value = ev.ubicacion || '';
        deleteEventBtn.classList.remove('hidden');
        evAsistentes.querySelectorAll('.ev-asis-chk').forEach(function(c){
          c.checked = asistentesIds.indexOf(Number(c.value)) !== -1;
        });
        evVisualizadores.querySelectorAll('.ev-vis-chk').forEach(function(c){
          c.checked = visualizadoresIds.indexOf(Number(c.value)) !== -1;
        });
        detailOverlay.classList.add('hidden');
        eventOverlay.classList.remove('hidden');
      }

      closeEventModal.addEventListener('click', function(){ eventOverlay.classList.add('hidden'); });
      cancelEventBtn.addEventListener('click', function(){ eventOverlay.classList.add('hidden'); });

      saveEventBtn.addEventListener('click', function(){
        var titulo = evTitulo.value.trim();
        var inicio = evInicio.value;
        var fin = evFin.value;
        eventModalMsg.className = 'modal-msg';

        if (!titulo) { eventModalMsg.textContent = 'El título es obligatorio.'; eventModalMsg.classList.add('err'); return; }
        if (!inicio || !fin) { eventModalMsg.textContent = 'Completá fecha y hora de inicio y fin.'; eventModalMsg.classList.add('err'); return; }
        if (new Date(fin) < new Date(inicio)) { eventModalMsg.textContent = 'La fecha de fin no puede ser anterior al inicio.'; eventModalMsg.classList.add('err'); return; }

        var asistentesIds = Array.prototype.map.call(
          evAsistentes.querySelectorAll('.ev-asis-chk:checked'), function(c){ return Number(c.value); }
        );
        var visualizadoresIds = Array.prototype.map.call(
          evVisualizadores.querySelectorAll('.ev-vis-chk:checked'), function(c){ return Number(c.value); }
        );

        var idExistente = evId.value ? Number(evId.value) : null;
        var payload = {
          p_titulo: titulo,
          p_descripcion: evDescripcion.value.trim() || null,
          p_fecha_inicio: new Date(inicio).toISOString(),
          p_fecha_fin: new Date(fin).toISOString(),
          p_ubicacion: evUbicacion.value.trim() || null,
          p_asistentes: asistentesIds,
          p_visualizadores: visualizadoresIds
        };

        var promesa;
        if (idExistente) {
          payload.p_evento_id = idExistente;
          payload.p_usuario_id = session.id;
          promesa = sbRpc('rpc_agenda_editar_evento', payload);
        } else {
          payload.p_creador_id = session.id;
          promesa = sbRpc('rpc_agenda_crear_evento', payload);
        }

        promesa.then(function(){
          eventOverlay.classList.add('hidden');
          renderCalendario();
        }).catch(function(err){
          eventModalMsg.textContent = err.message || 'Error al guardar la reunión.';
          eventModalMsg.classList.add('err');
        });
      });

      deleteEventBtn.addEventListener('click', function(){
        var idExistente = evId.value ? Number(evId.value) : null;
        if (!idExistente) return;
        if (!confirm('¿Eliminar esta reunión para todos los participantes?')) return;
        sbRpc('rpc_agenda_eliminar_evento', { p_evento_id: idExistente, p_usuario_id: session.id }).then(function(){
          eventOverlay.classList.add('hidden');
          renderCalendario();
        }).catch(function(err){
          eventModalMsg.textContent = err.message || 'Error al eliminar.';
          eventModalMsg.classList.add('err');
        });
      });

      // ---------- detalle de evento ----------
      function abrirDetalle(eventoId){
        currentDetailEventId = eventoId;
        detailMsg.textContent = '';
        detailTitle.textContent = 'Cargando…';
        detailTime.textContent = '';
        detailDescripcion.textContent = '';
        detailUbicacion.textContent = '';
        detailCreador.textContent = '';
        detailParticipantes.innerHTML = '';
        detailActions.innerHTML = '';
        detailOverlay.classList.remove('hidden');

        sbRpc('rpc_agenda_detalle_evento', { p_evento_id: eventoId, p_usuario_id: session.id }).then(function(rows){
          if (!rows.length) { detailTitle.textContent = 'No se encontró la reunión.'; return; }
          var ev = rows[0];
          var participantes = ev.participantes || [];
          var soyCreador = ev.creado_por === session.id;
          var miParticipacion = participantes.filter(function(p){ return p.usuario_id === session.id; })[0];

          detailTitle.textContent = ev.titulo;
          detailTime.textContent = fmtFechaLarga(new Date(ev.fecha_inicio)) + ' · ' + fmtHora(new Date(ev.fecha_inicio)) + ' – ' + fmtHora(new Date(ev.fecha_fin));
          detailDescripcion.textContent = ev.descripcion || '';
          detailUbicacion.textContent = ev.ubicacion ? ('📍 ' + ev.ubicacion) : '';
          detailCreador.textContent = ev.creador_nombre;

          detailParticipantes.innerHTML = participantes.map(function(p){
            var dot = '<span class="cal-legend-dot" style="background:'+(p.color || '#6B4FA0')+'; display:inline-block; margin-right:6px;"></span>';
            var estadoHtml = p.tipo === 'visualizador'
              ? '<span class="badge seguimiento">seguimiento</span>'
              : '<span class="badge '+p.estado+'">'+p.estado+'</span>';
            return '<div class="detail-participante"><span>'+dot+escHtml(p.nombre)+'</span>'+estadoHtml+'</div>';
          }).join('');

          var actionsHtml = '';
          if (soyCreador) {
            actionsHtml += '<button class="btn danger" id="detDeleteBtn">Eliminar</button>';
            actionsHtml += '<button class="btn primary" id="detEditBtn">Editar</button>';
          } else if (miParticipacion && miParticipacion.tipo === 'asistente') {
            actionsHtml += '<button class="btn danger" id="detRechazarBtn">Rechazar</button>';
            actionsHtml += '<button class="btn primary" id="detConfirmarBtn">Confirmar</button>';
          }
          detailActions.innerHTML = actionsHtml;

          var editBtn = document.getElementById('detEditBtn');
          if (editBtn) editBtn.addEventListener('click', function(){
            var asistentesIds = participantes.filter(function(p){ return p.tipo === 'asistente'; }).map(function(p){ return p.usuario_id; });
            var visualizadoresIds = participantes.filter(function(p){ return p.tipo === 'visualizador'; }).map(function(p){ return p.usuario_id; });
            abrirFormularioEditar(ev, asistentesIds, visualizadoresIds);
          });
          var delBtn = document.getElementById('detDeleteBtn');
          if (delBtn) delBtn.addEventListener('click', function(){
            if (!confirm('¿Eliminar esta reunión para todos los participantes?')) return;
            sbRpc('rpc_agenda_eliminar_evento', { p_evento_id: ev.id, p_usuario_id: session.id }).then(function(){
              detailOverlay.classList.add('hidden');
              renderCalendario();
            }).catch(function(err){ detailMsg.textContent = err.message; detailMsg.className='modal-msg err'; });
          });
          var confBtn = document.getElementById('detConfirmarBtn');
          if (confBtn) confBtn.addEventListener('click', function(){ responder(ev.id, 'confirmado'); });
          var rechBtn = document.getElementById('detRechazarBtn');
          if (rechBtn) rechBtn.addEventListener('click', function(){ responder(ev.id, 'rechazado'); });
        }).catch(function(){
          detailTitle.textContent = 'Error al cargar la reunión.';
        });
      }

      function responder(eventoId, estado){
        sbRpc('rpc_agenda_responder', { p_evento_id: eventoId, p_usuario_id: session.id, p_estado: estado }).then(function(){
          detailOverlay.classList.add('hidden');
          renderCalendario();
        }).catch(function(err){
          detailMsg.textContent = err.message || 'Error al responder.';
          detailMsg.className = 'modal-msg err';
        });
      }

      closeDetailModal.addEventListener('click', function(){ detailOverlay.classList.add('hidden'); });

      // ---------- init ----------
      cargarUsuarios().then(renderCalendario);

    })();
  </script>
</body>
